<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pivovar Rudohor - Objednávková kalkulačka</title>
<style>
  body {
    background-color: #0f0f11;
    color: #f1f1f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
    padding-bottom: 140px;
    -webkit-tap-highlight-color: transparent;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 12px; }
  .brand-btn { background-color: #ff9800; color: #0f0f11; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; }
  .brand-btn:hover { background-color: #e68a00; }
  .card { background-color: #18181c; border: 1px solid #282830; border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
  .card-header { width: 100%; padding: 14px; display: flex; justify-content: space-between; align-items: center; background: #18181c; color: #fff; border: none; cursor: pointer; font-size: 14px; font-weight: bold; text-align: left; }
  .sub-card { background-color: #121215; border: 1px solid #24242c; border-radius: 10px; padding: 10px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  input[type="text"], input[type="number"] { width: 100%; padding: 12px; background: #18181c; border: 1px solid #282830; border-radius: 12px; color: white; font-size: 16px; box-sizing: border-box; outline: none; }
  input:focus { border-color: #ff9800; }
  .qty-btn { width: 32px; height: 32px; background: #24242c; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qty-btn.brand { background: #ff9800; color: #0f0f11; }
  .fixed-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20, 20, 23, 0.95); backdrop-filter: blur(10px); border-top: 1px solid #282830; padding: 12px; z-index: 20; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 12px; }
  .modal.hidden { display: none; }
  .modal-content { background: #18181c; border: 1px solid #282830; width: 100%; max-width: 440px; border-radius: 16px; padding: 16px; max-height: 90vh; display: flex; flex-direction: column; }
  .badge { background: rgba(255,152,0,0.2); color: #ff9800; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: bold; }
  .text-brand { color: #ff9800; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .flex-row { display: flex; gap: 8px; align-items: center; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #ff9800; color: #0f0f11; padding: 8px 16px; border-radius: 10px; font-weight: bold; z-index: 100; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="container">
  <!-- SEARCH BAR -->
  <div class="flex-row" style="margin-bottom: 12px;">
    <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Hledat pivo nebo limonádu...">
  </div>

  <!-- TOP ACTIONS -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px;">
    <button type="button" onclick="toggleCurrency()" class="brand-btn" style="padding: 6px 10px; font-size: 11px;">
      <span id="currencyBadge">CZK (Kč)</span> ⇄
    </button>
    <div class="flex-row" style="gap: 12px;">
      <span onclick="showArchiveModal()" style="color: #ff9800; cursor: pointer; font-weight: 600;">📦 Archiv (<span id="archiveBadgeCount">0</span>)</span>
    </div>
  </div>

  <!-- PRODUCTS LIST -->
  <div id="productList"></div>

  <!-- DEPOSITS SECTION -->
  <div class="card" style="padding: 12px; margin-top: 16px;">
    <h3 style="font-size: 14px; margin: 0 0 10px 0; color: white;">🔄 Zálohy na obaly a sudy (Vratky / Nákup)</h3>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="sub-card">
        <div>
          <div style="font-weight: 600; color: #e2e8f0; font-size: 12px;">Vracení Sud Pivo</div>
          <div style="font-size: 10px; color: #34d399; font-weight: bold;">-1 200 Kč / ks</div>
        </div>
        <div class="flex-row">
          <button type="button" onclick="changeReturnedKegs('beer', -1)" class="qty-btn">-</button>
          <span id="returnedBeerKegsQty" style="width: 24px; text-align: center; font-weight: bold;">0</span>
          <button type="button" onclick="changeReturnedKegs('beer', 1)" class="qty-btn brand">+</button>
        </div>
      </div>
      <div class="sub-card">
        <div>
          <div style="font-weight: 600; color: #e2e8f0; font-size: 12px;">Vracení Sud Limo</div>
          <div style="font-size: 10px; color: #34d399; font-weight: bold;">-1 000 Kč / ks</div>
        </div>
        <div class="flex-row">
          <button type="button" onclick="changeReturnedKegs('limo', -1)" class="qty-btn">-</button>
          <span id="returnedLimoKegsQty" style="width: 24px; text-align: center; font-weight: bold;">0</span>
          <button type="button" onclick="changeReturnedKegs('limo', 1)" class="qty-btn brand">+</button>
        </div>
      </div>
      <div class="sub-card">
        <div>
          <div style="font-weight: 600; color: #e2e8f0; font-size: 12px;">Přepravka na pivo</div>
          <div style="font-size: 10px; color: #ff9800; font-weight: bold;">±150 Kč / ks</div>
        </div>
        <div class="flex-row">
          <button type="button" onclick="changeCrates(-1)" class="qty-btn">-</button>
          <span id="cratesQty" style="width: 24px; text-align: center; font-weight: bold;">0</span>
          <button type="button" onclick="changeCrates(1)" class="qty-btn brand">+</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- FIXED BOTTOM BAR -->
<div class="fixed-bottom">
  <div class="container" style="padding: 0;">
    <div class="grid-2" style="margin-bottom: 8px;">
      <div style="background: #18181c; border: 1px solid #282830; border-radius: 10px; padding: 8px; text-align: center;">
        <div style="font-size: 10px; color: #9ca3af; text-transform: uppercase;">Cena za nápoje</div>
        <div style="font-size: 16px; font-weight: bold;" class="text-brand" id="sumBeverages">0 Kč</div>
      </div>
      <div style="background: #18181c; border: 1px solid #282830; border-radius: 10px; padding: 8px; text-align: center;">
        <div style="font-size: 10px; color: #9ca3af; text-transform: uppercase;">Záloha / Vratka</div>
        <div style="font-size: 16px; font-weight: bold;" class="text-brand" id="sumDeposits">0 Kč</div>
      </div>
    </div>
    <button type="button" onclick="openModal()" class="brand-btn" style="width: 100%; padding: 14px; font-size: 15px;">
      Zobrazit a kopírovat objednávku
    </button>
  </div>
</div>

<!-- ORDER MODAL -->
<div id="orderModal" class="modal hidden">
  <div class="modal-content">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #282830; padding-bottom: 10px;">
      <h3 style="margin: 0; font-size: 16px; color: white;">Detail Objednávky</h3>
      <button type="button" onclick="closeModal()" style="background: none; border: none; color: #9ca3af; font-size: 18px; cursor: pointer;">✕</button>
    </div>
    <div id="modalOrderItems" style="overflow-y: auto; margin: 12px 0; flex-grow: 1; display: flex; flex-direction: column; gap: 8px;"></div>
    <div style="border-top: 1px solid #282830; padding-top: 10px;">
      <button type="button" onclick="markAsPaid()" style="width: 100%; background: #10b981; color: #030712; font-weight: 800; padding: 14px; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; margin-bottom: 8px;">ZAPLACENO (Uložit objednávku)</button>
      <div style="display: flex; justify-content: space-between;">
        <button type="button" onclick="resetAllOrders()" style="background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.3); padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;">Vynulovat</button>
        <button type="button" onclick="copyOrderText()" class="brand-btn" style="padding: 8px 16px; font-size: 12px;">Kopírovat text</button>
      </div>
    </div>
  </div>
</div>

<!-- ARCHIVE MODAL -->
<div id="archiveModal" class="modal hidden">
  <div class="modal-content">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #282830; padding-bottom: 10px;">
      <h3 style="margin: 0; font-size: 16px; color: white;">📦 Archiv objednávek</h3>
      <button type="button" onclick="closeArchiveModal()" style="background: none; border: none; color: #9ca3af; font-size: 18px; cursor: pointer;">✕</button>
    </div>
    <div id="archiveList" style="overflow-y: auto; margin: 12px 0; flex-grow: 1; font-size: 12px;"></div>
    <button type="button" onclick="closeArchiveModal()" class="brand-btn" style="padding: 10px;">Zavřít</button>
  </div>
</div>

<div id="toast" class="toast">Hotovo</div>

<script>
const DEPOSIT_BEER = 1200;
const DEPOSIT_LIMO = 1000;
const DEPOSIT_CRATE = 150;
const KEG_KEYS = ['k50', 'k30', 'k15'];

let returnedBeerKegs = 0;
let returnedLimoKegs = 0;
let cratesQty = 0;
let openAccordions = {};
let currentCurrency = 'CZK';
let eurRate = 24.0;

const FORMAT_NAMES = {
  k50: '50 l KEG', k30: '30 l KEG', k15: '15 l KEG',
  p15: '1,5 l PET', p10: '1,0 l PET', s075: '0,75 l SKLO', s05: '0,5 l SKLO'
};

const PRODUCTS = [
  { id: 'petnik_nealko', name: 'Rudohor PĚTNÍK Nealko Pivo', type: 'beer', prices: { k50: 2429, k30: 1509, p10: 65, s05: 50 } },
  { id: 'petnik_nealko_ochucene', name: 'Rudohor PĚTNÍK Nealko Pivo (Grep/Malina)', type: 'beer', prices: { k50: 2551, k30: 1584, p10: 69, s05: 52 } },
  { id: 'gros_10', name: 'Rudohor GROŠ 10° Světlé výčepní', type: 'beer', prices: { k50: 2429, k30: 1509, p15: 90, p10: 65, s075: 75, s05: 50 } },
  { id: 'tolar_11', name: 'Rudohor TOLAR 11° Světlý ležák', type: 'beer', prices: { k50: 2724, k30: 1669, k15: 883, p15: 98, p10: 70, s075: 80, s05: 52 } },
  { id: 'dukat_12', name: 'Rudohor DUKÁT 12° Premium ležák', type: 'beer', prices: { k50: 3141, k30: 1938, k15: 1031, p15: 111, p10: 77, s075: 88, s05: 58 } },
  { id: 'gresle_13', name: 'Rudohor GREŠLE 13° Polotmavý ležák', type: 'beer', prices: { k50: 3202, k30: 1975, k15: 1043, p15: 113, p10: 80, s075: 92, s05: 60 } },
  { id: 'schlick_svatecni', name: 'Rudohor SCHLICK Sváteční ležák', type: 'beer', prices: { k50: 3202, k30: 1975, k15: 1043, p15: 112, p10: 79, s075: 89, s05: 59 } },
  { id: 'dollar_12', name: 'Rudohor DOLLAR 12° American Pale Ale', type: 'beer', prices: { k50: 3482, k30: 2135, k15: 1153, p15: 128, p10: 90, s075: 96, s05: 67 } },
  { id: 'punt_14', name: 'Rudohor PUNT ÉIREANNACH 14° Stout', type: 'beer', prices: { k50: 3751, k30: 2307, k15: 1239, p10: 100, s075: 102, s05: 76 } },
  { id: 'rupya_14', name: 'Rudohor RŪPYA 14° India Pale Ale', type: 'beer', prices: { k50: 3914, k30: 2380, k15: 1313, p15: 146, p10: 106, s075: 107, s05: 80 } },
  { id: 'darkove_baleni', name: 'Dárkové balení piva', type: 'beer', prices: { s075: 340 } },
  { id: 'limo_rudohorka', name: 'Limonáda Rudohorka', type: 'limo', prices: { k50: 1297, p10: 60 } }
];

let state = {};
PRODUCTS.forEach(p => {
  state[p.id] = {};
  Object.keys(p.prices).forEach(fmtKey => state[p.id][fmtKey] = 0);
});

function formatPrice(amountCzk) {
  if (currentCurrency === 'EUR') {
    return (amountCzk / eurRate).toLocaleString('cs-CZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  }
  return amountCzk.toLocaleString('cs-CZ') + ' Kč';
}

function toggleCurrency() {
  currentCurrency = currentCurrency === 'CZK' ? 'EUR' : 'CZK';
  document.getElementById('currencyBadge').innerText = currentCurrency === 'CZK' ? 'CZK (Kč)' : 'EUR (€)';
  calculateTotals();
  renderProducts(document.getElementById('searchInput').value);
}

function toggleAccordion(productId) {
  openAccordions[productId] = !openAccordions[productId];
  renderProducts(document.getElementById('searchInput').value);
}

function renderProducts(filterText = '') {
  const container = document.getElementById('productList');
  if (!container) return;
  container.innerHTML = '';
  const search = filterText.toLowerCase().trim();

  PRODUCTS.forEach(p => {
    if (search && !p.name.toLowerCase().includes(search)) return;
    let totalQty = 0;
    Object.keys(p.prices).forEach(fmtKey => totalQty += (state[p.id][fmtKey] || 0));
    const isOpen = search.length > 0 ? true : !!openAccordions[p.id];

    let formatsHtml = '';
    Object.keys(p.prices).forEach(fmtKey => {
      const priceCzk = p.prices[fmtKey];
      const fmtName = FORMAT_NAMES[fmtKey] || fmtKey;
      const qty = state[p.id][fmtKey] || 0;
      formatsHtml += `<div class="sub-card" style="margin-bottom: 4px;">
        <div>
          <span style="font-weight: 600; color: #e2e8f0; font-size: 12px;">${fmtName}</span>
          <span class="text-brand" style="font-weight: bold; margin-left: 6px; font-size: 12px;">${formatPrice(priceCzk)}</span>
        </div>
        <div class="flex-row">
          <button type="button" onclick="changeQty('${p.id}', '${fmtKey}', -1)" class="qty-btn">-</button>
          <span style="width: 24px; text-align: center; font-weight: bold; color: white;">${qty}</span>
          <button type="button" onclick="changeQty('${p.id}', '${fmtKey}', 1)" class="qty-btn brand">+</button>
        </div>
      </div>`;
    });

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<button type="button" onclick="toggleAccordion('${p.id}')" class="card-header">
      <span style="padding-right: 8px;">${p.name}</span>
      <div class="flex-row" style="gap: 8px;">
        ${totalQty > 0 ? `<span class="badge">${totalQty} ks</span>` : ''}
        <span class="text-brand" style="font-size: 11px;">${isOpen ? '▲' : '▼'}</span>
      </div>
    </button>
    <div style="display: ${isOpen ? 'block' : 'hidden'}; padding: 8px; background: #141417; border-top: 1px solid #24242c;">
      ${formatsHtml}
    </div>`;
    container.appendChild(card);
  });
  updateArchiveBadge();
}

function changeQty(productId, fmtKey, delta) {
  if (!state[productId]) state[productId] = {};
  state[productId][fmtKey] = Math.max(0, (state[productId][fmtKey] || 0) + delta);
  calculateTotals();
  renderProducts(document.getElementById('searchInput').value);
}

function calculateTotals() {
  let bev = 0, dep = 0;
  PRODUCTS.forEach(p => {
    Object.keys(p.prices).forEach(fmtKey => {
      const q = state[p.id][fmtKey] || 0;
      if (q > 0) {
        bev += q * p.prices[fmtKey];
        if (KEG_KEYS.includes(fmtKey)) dep += q * (p.type === 'limo' ? DEPOSIT_LIMO : DEPOSIT_BEER);
      }
    });
  });
  dep -= (returnedBeerKegs * DEPOSIT_BEER) + (returnedLimoKegs * DEPOSIT_LIMO);
  dep += (cratesQty * DEPOSIT_CRATE);

  document.getElementById('sumBeverages').innerText = formatPrice(bev);
  document.getElementById('sumDeposits').innerText = formatPrice(dep);
}

function filterProducts() { renderProducts(document.getElementById('searchInput').value); }

function changeReturnedKegs(t, d) {
  if (t === 'beer') {
    returnedBeerKegs = Math.max(0, returnedBeerKegs + d);
    document.getElementById('returnedBeerKegsQty').innerText = returnedBeerKegs;
  } else {
    returnedLimoKegs = Math.max(0, returnedLimoKegs + d);
    document.getElementById('returnedLimoKegsQty').innerText = returnedLimoKegs;
  }
  calculateTotals();
}

function changeCrates(d) {
  cratesQty = Math.max(0, cratesQty + d);
  document.getElementById('cratesQty').innerText = cratesQty;
  calculateTotals();
}

function updateArchiveBadge() {
  try {
    const arch = JSON.parse(localStorage.getItem('RUDOHOR_ORDER_ARCHIVE') || '[]');
    document.getElementById('archiveBadgeCount').innerText = arch.length;
  } catch(e) {}
}

function showArchiveModal() {
  const list = document.getElementById('archiveList');
  const arch = JSON.parse(localStorage.getItem('RUDOHOR_ORDER_ARCHIVE') || '[]');
  if (arch.length === 0) {
    list.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 20px;">Žádné uložené objednávky.</div>';
  } else {
    list.innerHTML = arch.map((o, idx) => `<div style="background: #121215; padding: 8px; border-radius: 8px; margin-bottom: 6px;">Objednávka #${idx+1}</div>`).join('');
  }
  document.getElementById('archiveModal').classList.remove('hidden');
}

function closeArchiveModal() { document.getElementById('archiveModal').classList.add('hidden'); }

function openModal() {
  const container = document.getElementById('modalOrderItems');
  container.innerHTML = '';
  let itemsCount = 0;
  
  PRODUCTS.forEach(p => {
    Object.keys(p.prices).forEach(fmtKey => {
      const q = state[p.id][fmtKey] || 0;
      if (q > 0) {
        itemsCount++;
        const price = p.prices[fmtKey] * q;
        const div = document.createElement('div');
        div.style.cssText = 'background: #121215; padding: 10px; border-radius: 10px; border: 1px solid #24242c; display: flex; justify-content: space-between; align-items: center; font-size: 13px;';
        div.innerHTML = `<div><div style="font-weight: bold; color: white;">${p.name}</div><div style="font-size: 11px; color: #9ca3af;">${FORMAT_NAMES[fmtKey]} × ${q} ks</div></div><div class="text-brand" style="font-weight: bold;">${formatPrice(price)}</div>`;
        container.appendChild(div);
      }
    });
  });

  if (itemsCount === 0) {
    container.innerHTML = '<div style="text-align: center; color: #9ca3af; font-size: 12px; padding: 20px;">Žádné položky v objednávce.</div>';
  }
  document.getElementById('orderModal').classList.remove('hidden');
}

function closeModal() { document.getElementById('orderModal').classList.add('hidden'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => { t.classList.remove('show'); }, 2000);
}

function markAsPaid() {
  const arch = JSON.parse(localStorage.getItem('RUDOHOR_ORDER_ARCHIVE') || '[]');
  arch.push({ date: new Date().toISOString() });
  localStorage.setItem('RUDOHOR_ORDER_ARCHIVE', JSON.stringify(arch));
  showToast('Objednávka uložena do archivu');
  closeModal();
  updateArchiveBadge();
}

function resetAllOrders() {
  PRODUCTS.forEach(p => {
    Object.keys(p.prices).forEach(fmtKey => state[p.id][fmtKey] = 0);
  });
  returnedBeerKegs = 0;
  returnedLimoKegs = 0;
  cratesQty = 0;
  document.getElementById('returnedBeerKegsQty').innerText = '0';
  document.getElementById('returnedLimoKegsQty').innerText = '0';
  document.getElementById('cratesQty').innerText = '0';
  calculateTotals();
  renderProducts();
  closeModal();
  showToast('Vše vynulováno');
}

function copyOrderText() {
  showToast('Objednávka zkopírována');
}

window.onload = function() {
  renderProducts();
  calculateTotals();
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pivovar Rudohor - Objednávková kalkulačka</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
theme: {
extend: {
colors: {
brand: '#ff9800',
brandDark: '#e68a00',
darkBg: '#0f0f11',
cardBg: '#18181c',
cardBorder: '#282830',
}
}
}
}
</script>
<style>
body {
background-color: #0f0f11;
color: #f1f1f5;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
-webkit-tap-highlight-color: transparent;
}
</style>
</head>
<body class="min-h-screen pb-64 select-none">
<div class="max-w-md mx-auto px-3 pt-3">
<div class="mb-3 px-1 flex justify-between items-center text-xs">
<span class="text-brand font-bold">📦 Archiv (0)</span>
</div>
​<!-- PRODUCTS CONTAINER -->
<div id="productList" class="space-y-2 mb-4">
<p class="text-center text-gray-400 py-4">Načítám produkty...</p>
</div>
​<div class="bg-[#18181c] border border-[#282830] rounded-2xl p-3 mb-6 shadow-md">
<h3 class="font-bold text-sm text-white mb-2">Zálohy na obaly a sudy</h3>
<div class="text-xs text-gray-400">Sekce obalů je aktivní.</div>
</div>
</div>
​<script>
const PRODUCTS = [
{ id: 'gros_10', name: 'Rudohor GROŠ 10° Světlé výčepní', type: 'beer', prices: { k50: 2429, k30: 1509, s05: 50 } },
{ id: 'tolar_11', name: 'Rudohor TOLAR 11° Světlý ležák', type: 'beer', prices: { k50: 2724, k30: 1669, s05: 52 } }
];
​let state = {};
PRODUCTS.forEach(p => {
state[p.id] = {};
Object.keys(p.prices).forEach(fmtKey => state[p.id][fmtKey] = 0);
});
​function renderProducts() {
const container = document.getElementById('productList');
if (!container) return;
container.innerHTML = '';
​PRODUCTS.forEach(p => {
const card = document.createElement('div');
card.className = 'bg-[#18181c] border border-[#282830] rounded-xl p-3 text-white text-sm font-bold';
card.innerText = p.name;
container.appendChild(card);
});
}
​window.onload = function() {
try {
renderProducts();
} catch (e) {
console.error(e);
}
};
</script>
</body>
</html>

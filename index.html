<body>
<div class="container">
<!-- SEARCH & SCANNER BAR -->
<div class="relative mb-2 flex gap-2">
<div class="relative flex-grow">
<div class="absolute inset-y-0 left-0 pl-3-5 flex items-center pointer-events-none text-gray-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
</div>
<input type="text" id="searchInput" oninput="filterProducts()" placeholder="Hledat pivo nebo limonádu..." class="w-full pl-10 pr-4 py-3 bg-card border rounded-xl text-white text-base">
</div>
<button type="button" onclick="openScanner('scan')" class="bg-brand text-gray-950 font-bold px-3 py-3 rounded-xl flex items-center justify-center gap-2">Skenovat</button>
<button type="button" onclick="openScanner('learn')" class="bg-inner text-brand border border-brand/30 font-bold px-3 py-3 rounded-xl flex items-center justify-center">Učit EAN</button>
</div>
​<!-- ACTION BUTTONS -->
<div class="mb-3 px-1 flex justify-between items-center text-xs">
<button type="button" onclick="toggleCurrency()" class="bg-card border text-gray-200 font-bold px-2-5 py-1 rounded-lg">CZK (Kč) ⇄</button>
<div class="flex items-center gap-3">
<button type="button" onclick="showArchiveModal()" class="text-brand font-semibold">📦 Archiv <span id="archiveCountBadge" class="bg-brand/20 px-1-5 py-0-5 rounded-full">0</span></button>
<button type="button" onclick="showSavedEansModal()" class="text-brand font-semibold">Správa EAN</button>
</div>
</div>
​<!-- PRODUCTS LIST -->
<div id="productList" class="space-y-2 mb-4"></div>
​<!-- KEGS & CRATES -->
<div class="bg-card border rounded-2xl p-3 mb-6 shadow-md">
<h3 class="font-bold text-sm text-white mb-2">🔄 Zálohy na obaly a sudy</h3>
<div class="grid grid-cols-1 sm-grid-cols-3 gap-2 text-xs">
<div class="bg-inner p-2-5 rounded-xl border flex justify-between items-center">
<div>
<div class="font-semibold text-gray-200">Sud Pivo</div>
<div class="text-xs text-emerald font-bold" id="labelBeerKegDep">-1 200 Kč</div>
</div>
<div class="flex items-center gap-2">
<button type="button" onclick="changeReturnedKegs('beer', -1)" class="w-7 h-7 bg-btn-bg text-white rounded-lg font-bold">-</button>
<span id="returnedBeerKegsQty" class="w-5 text-center font-bold text-white text-base">0</span>
<button type="button" onclick="changeReturnedKegs('beer', 1)" class="w-7 h-7 bg-brand text-gray-950 rounded-lg font-bold">+</button>
</div>
</div>
<div class="bg-inner p-2-5 rounded-xl border flex justify-between items-center">
<div>
<div class="font-semibold text-gray-200">Sud Limo</div>
<div class="text-xs text-emerald font-bold" id="labelLimoKegDep">-1 000 Kč</div>
</div>
<div class="flex items-center gap-2">
<button type="button" onclick="changeReturnedKegs('limo', -1)" class="w-7 h-7 bg-btn-bg text-white rounded-lg font-bold">-</button>
<span id="returnedLimoKegsQty" class="w-5 text-center font-bold text-white text-base">0</span>
<button type="button" onclick="changeReturnedKegs('limo', 1)" class="w-7 h-7 bg-brand text-gray-950 rounded-lg font-bold">+</button>
</div>
</div>
<div class="bg-inner p-2-5 rounded-xl border flex justify-between items-center">
<div>
<div class="font-semibold text-gray-200">Přepravka</div>
<div class="text-xs text-brand font-bold" id="crateStatusLabel">±150 Kč</div>
</div>
<div class="flex items-center gap-2">
<button type="button" onclick="changeCrates(-1)" class="w-7 h-7 bg-btn-bg text-white rounded-lg font-bold">-</button>
<span id="cratesQty" class="w-6 text-center font-bold text-white text-base">0</span>
<button type="button" onclick="changeCrates(1)" class="w-7 h-7 bg-brand text-gray-950 rounded-lg font-bold">+</button>
</div>
</div>
</div>
</div>
</div>
​<!-- FIXED BOTTOM BAR -->
<div class="fixed bottom-0 left-0 right-0 bg-card border-t p-3 shadow-2xl z-20">
<div class="max-w-md mx-auto">
<div class="grid grid-cols-2 gap-2 mb-2">
<div class="bg-inner border rounded-lg p-2 text-center">
<div class="text-xs uppercase text-gray-400">NÁPOJE</div>
<div class="text-lg font-bold text-brand" id="sumBeverages">0 Kč</div>
</div>
<div class="bg-inner border rounded-lg p-2 text-center">
<div class="text-xs uppercase text-gray-400">ZÁLOHA / VRATKA</div>
<div class="text-lg font-bold text-brand" id="sumDeposits">0 Kč</div>
</div>
</div>
<button type="button" onclick="openModal()" class="w-full bg-brand text-gray-950 font-bold py-3-5 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 text-base">Zobrazit a kopírovat objednávku</button>
</div>
</div>
​<!-- MODALS -->
<div id="orderModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-3">
<div class="bg-card border w-full max-w-md rounded-2xl p-5 shadow-2xl relative max-h-90vh flex flex-col">
<div class="flex justify-between items-center pb-3 border-b">
<h3 class="text-lg font-bold text-white">Detail Objednávky</h3>
<button type="button" onclick="closeModal()" class="text-gray-400 p-1">✕</button>
</div>
<div id="modalOrderItems" class="py-4 overflow-y-auto space-y-3 flex-grow text-sm"></div>
<div class="pt-3 border-t space-y-2">
<button type="button" onclick="markAsPaid()" class="w-full bg-emerald text-gray-950 font-extrabold py-3.5 rounded-xl shadow-xl">ZAPLACENO (Uložit)</button>
<div class="flex justify-between items-center pt-1">
<button type="button" onclick="resetAllOrders()" class="bg-red/20 text-red font-semibold py-2 px-3 rounded-lg text-xs">Vynulovat</button>
<div class="flex gap-2">
<button type="button" onclick="sendToWhatsApp()" class="bg-inner text-emerald font-medium py-2 px-3 rounded-lg border text-xs">WhatsApp</button>
<button type="button" onclick="copyOrderText()" class="bg-inner text-gray-300 font-medium py-2 px-3 rounded-lg border text-xs">Kopírovat</button>
</div>
</div>
</div>
</div>
</div>
​<div id="archiveModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-3">
<div class="bg-card border w-full max-w-lg rounded-2xl p-4 shadow-2xl relative max-h-90vh flex flex-col">
<div class="flex justify-between items-center pb-3 border-b">
<h3 class="text-base font-bold text-white">Archiv objednávek</h3>
<button type="button" onclick="closeArchiveModal()" class="text-gray-400 p-1">✕</button>
</div>
<div id="archiveList" class="overflow-y-auto my-3 space-y-3 flex-grow text-xs"></div>
<button type="button" onclick="closeArchiveModal()" class="bg-inner text-white py-2 rounded-xl text-xs">Zavřít</button>
</div>
</div>
​<div id="savedEansModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-3">
<div class="bg-card border w-full max-w-md rounded-2xl p-4 shadow-2xl relative max-h-90vh flex flex-col">
<div class="flex justify-between items-center pb-3 border-b">
<h3 class="text-base font-bold text-white">Uložené EAN kódy</h3>
<button type="button" onclick="closeSavedEansModal()" class="text-gray-400 p-1">✕</button>
</div>
<div id="savedEansList" class="overflow-y-auto my-3 space-y-3 flex-grow text-xs"></div>
<button type="button" onclick="closeSavedEansModal()" class="bg-inner text-white py-2 rounded-xl text-xs">Zavřít</button>
</div>
</div>
​<div id="scannerModal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col items-center justify-center p-4">
<div class="bg-card border w-full max-w-md rounded-2xl p-4 shadow-2xl flex flex-col items-center">
<h3 class="text-lg font-bold text-white mb-3">Ruční zadání EAN</h3>
<input type="text" id="manualEanInput" placeholder="Zadejte EAN kód..." class="w-full px-3 py-2 bg-inner border rounded-xl text-white text-sm mb-3">
<div class="flex gap-2 w-full">
<button type="button" onclick="submitManualEan()" class="w-1/2 bg-brand text-gray-950 font-bold py-2 rounded-xl text-xs">Přidat</button>
<button type="button" onclick="closeScanner()" class="w-1/2 bg-inner text-white py-2 rounded-xl text-xs">Zavřít</button>
</div>
</div>
</div>
​<div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-brand text-gray-950 px-4 py-2 rounded-xl font-bold shadow-2xl opacity-0 transition pointer-events-none z-50 text-sm">Zkopírováno!</div>
​<script>
const DEPOSIT_BEER = 1200;
const DEPOSIT_LIMO = 1000;
const DEPOSIT_CRATE = 150;
const BANK_IBAN = "CZ7462106701002228815029";
const RECIPIENT_NAME = "PETR ŠTĚPÁN";
const KEG_KEYS = ['k50', 'k30', 'k15'];
​let returnedBeerKegs = 0, returnedLimoKegs = 0, cratesQty = 0;
let openAccordions = {};
let EAN_MAP = {};
let currentCurrency = 'CZK';
let eurRate = 24.0;
​const PRODUCTS = [
{ id: 'petnik_nealko', name: 'Rudohor PĚTNÍK Nealko Pivo', type: 'beer', prices: { k50: 2429, k30: 1509, p10: 65, s05: 50 } },
{ id: 'gros_10', name: 'Rudohor GROŠ 10° Světlé výčepní', type: 'beer', prices: { k50: 2429, k30: 1509, p15: 90, p10: 65, s075: 75, s05: 50 } },
{ id: 'tolar_11', name: 'Rudohor TOLAR 11° Světlý ležák', type: 'beer', prices: { k50: 2724, k30: 1669, k15: 883, p15: 98, p10: 70, s075: 80, s05: 52 } },
{ id: 'dukat_12', name: 'Rudohor DUKÁT 12° Premium ležák', type: 'beer', prices: { k50: 3141, k30: 1938, k15: 1031, p15: 111, p10: 77, s075: 88, s05: 58 } },
{ id: 'gresle_13', name: 'Rudohor GREŠLE 13° Polotmavý ležák', type: 'beer', prices: { k50: 3202, k30: 1975, k15: 1043, p15: 113, p10: 80, s075: 92, s05: 60 } },
{ id: 'dollar_12', name: 'Rudohor DOLLAR 12° American Pale Ale', type: 'beer', prices: { k50: 3482, k30: 2135, k15: 1153, p15: 128, p10: 90, s075: 96, s05: 67 } },
{ id: 'rupya_14', name: 'Rudohor RŪPYA 14° India Pale Ale', type: 'beer', prices: { k50: 3914, k30: 2380, k15: 1313, p15: 146, p10: 106, s075: 107, s05: 80 } },
{ id: 'limo_rudohorka', name: 'Limonáda Rudohorka', type: 'limo', prices: { k50: 1297, p10: 60 } }
];
​let state = {};
PRODUCTS.forEach(p => { state[p.id] = {}; Object.keys(p.prices).forEach(f => state[p.id][f] = 0); });
​const FORMAT_NAMES = { k50: '50 l KEG', k30: '30 l KEG', k15: '15 l KEG', p15: '1,5 l PET', p10: '1,0 l PET', s075: '0,75 l SKLO', s05: '0,5 l SKLO' };
​function formatPrice(amt) {
return currentCurrency === 'EUR' ? ${(amt / eurRate).toFixed(2)} € : ${amt.toLocaleString('cs-CZ')} Kč;
}
​function toggleCurrency() {
currentCurrency = currentCurrency === 'CZK' ? 'EUR' : 'CZK';
renderProducts(document.getElementById('searchInput').value);
calculateTotals();
}
​function toggleAccordion(id) {
openAccordions[id] = !openAccordions[id];
renderProducts(document.getElementById('searchInput').value);
}
​function changeQty(productId, fmtKey, delta) {
state[productId][fmtKey] = Math.max(0, (state[productId][fmtKey] || 0) + delta);
const el = document.getElementById(qty_${productId}_${fmtKey});
if (el) el.innerText = state[productId][fmtKey];
calculateTotals();
renderProducts(document.getElementById('searchInput').value);
}
​function changeReturnedKegs(type, delta) {
if (type === 'beer') returnedBeerKegs = Math.max(0, returnedBeerKegs + delta);
if (type === 'limo') returnedLimoKegs = Math.max(0, returnedLimoKegs + delta);
document.getElementById('returnedBeerKegsQty').innerText = returnedBeerKegs;
document.getElementById('returnedLimoKegsQty').innerText = returnedLimoKegs;
calculateTotals();
}
​function changeCrates(delta) {
cratesQty += delta;
document.getElementById('cratesQty').innerText = cratesQty;
calculateTotals();
}
​function calculateTotals() {
let bev = 0, dep = 0;
PRODUCTS.forEach(p => {
Object.keys(p.prices).forEach(f => {
const q = state[p.id][f] || 0;
if (q > 0) {
bev += q * p.prices[f];
if (KEG_KEYS.includes(f)) dep += q * (p.type === 'limo' ? DEPOSIT_LIMO : DEPOSIT_BEER);
}
});
});
dep -= (returnedBeerKegs * DEPOSIT_BEER) + (returnedLimoKegs * DEPOSIT_LIMO);
dep += (cratesQty * DEPOSIT_CRATE);
​document.getElementById('sumBeverages').innerText = formatPrice(bev);
document.getElementById('sumDeposits').innerText = formatPrice(dep);
}
​function renderProducts(query = '') {
const container = document.getElementById('productList');
container.innerHTML = '';
const q = query.toLowerCase().trim();
​PRODUCTS.forEach(p => {
if (q && !p.name.toLowerCase().includes(q)) return;
let totalQty = 0;
Object.keys(p.prices).forEach(f => totalQty += (state[p.id][f] || 0));
const isOpen = q ? true : !!openAccordions[p.id];
​let formatsHtml = '';
Object.keys(p.prices).forEach(f => {
formatsHtml +=  <div class="bg-inner p-2-5 rounded-xl border flex justify-between items-center text-xs"> <div><span class="font-semibold text-gray-200">${FORMAT_NAMES[f] || f}</span> <span class="text-brand font-bold">${formatPrice(p.prices[f])}</span></div> <div class="flex items-center gap-2"> <button type="button" onclick="changeQty('${p.id}', '${f}', -1)" class="w-7 h-7 bg-btn-bg text-white rounded-lg font-bold">-</button> <span id="qty_${p.id}_${f}" class="w-5 text-center font-bold text-white">${state[p.id][f]}</span> <button type="button" onclick="changeQty('${p.id}', '${f}', 1)" class="w-7 h-7 bg-brand text-gray-950 rounded-lg font-bold">+</button> </div> </div>;
});
​const card = document.createElement('div');
card.className = 'bg-card border rounded-xl overflow-hidden shadow-md';
card.innerHTML =  <button type="button" onclick="toggleAccordion('${p.id}')" class="w-full p-3 flex justify-between items-center text-left"> <span class="font-bold text-sm text-white">${p.name}</span> <span class="bg-brand text-gray-950 text-xs px-2 py-0.5 rounded-full font-bold">${totalQty > 0 ? totalQty + ' ks' : ''}</span> </button> <div class="${isOpen ? 'block' : 'hidden'} px-3 pb-3 border-t"><div class="grid grid-cols-1 sm-grid-cols-2 gap-2 mt-2">${formatsHtml}</div></div>;
container.appendChild(card);
});
}
​function filterProducts() { renderProducts(document.getElementById('searchInput').value); }
​function openModal() {
const container = document.getElementById('modalOrderItems');
container.innerHTML = '';
let bev = 0, dep = 0;
PRODUCTS.forEach(p => {
Object.keys(p.prices).forEach(f => {
const q = state[p.id][f] || 0;
if (q > 0) {
const price = q * p.prices[f];
bev += price;
container.innerHTML += <div class="flex justify-between text-xs border-b pb-1"><span>${p.name} (${FORMAT_NAMES[f]}) x${q}</span><span>${formatPrice(price)}</span></div>;
}
});
});
document.getElementById('orderModal').classList.remove('hidden');
}
function closeModal() { document.getElementById('orderModal').classList.add('hidden'); }
​function openScanner(mode) { document.getElementById('scannerModal').classList.remove('hidden'); }
function closeScanner() { document.getElementById('scannerModal').classList.add('hidden'); }
function submitManualEan() { closeScanner(); showToast('Zadáno'); }
​function showArchiveModal() { document.getElementById('archiveModal').classList.remove('hidden'); }
function closeArchiveModal() { document.getElementById('archiveModal').classList.add('hidden'); }
function showSavedEansModal() { document.getElementById('savedEansModal').classList.remove('hidden'); }
function closeSavedEansModal() { document.getElementById('savedEansModal').classList.add('hidden'); }
​function markAsPaid() { showToast('Uloženo!'); resetAllOrders(); closeModal(); }
function resetAllOrders() {
PRODUCTS.forEach(p => Object.keys(p.prices).forEach(f => state[p.id][f] = 0));
returnedBeerKegs = 0; returnedLimoKegs = 0; cratesQty = 0;
document.getElementById('returnedBeerKegsQty').innerText = '0';
document.getElementById('returnedLimoKegsQty').innerText = '0';
document.getElementById('cratesQty').innerText = '0';
renderProducts(); calculateTotals();
}
​function sendToWhatsApp() { window.open(https://wa.me/?text=${encodeURIComponent("Objednávka Rudohor")}, '_blank'); }
function copyOrderText() { showToast('Zkopírováno!'); }
​function showToast(msg) {
const t = document.getElementById('toast');
t.innerText = msg; t.style.opacity = '1';
setTimeout(() => t.style.opacity = '0', 2000);
}
​window.onload = function() { renderProducts(); calculateTotals(); };
</script>
</body>
</html>

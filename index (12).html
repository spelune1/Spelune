<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pivovar Rudohor - Objednávková kalkulačka</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- HTML5 QR / Barcode Scanner CDN -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<!-- QRious Library for guaranteed binary/ASCII QR code rendering -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<!-- JsBarcode Library for rendering 1D Barcodes (EAN) -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: '#ff9800',
        brandDark: '#e68a00',
        darkBg: '#0f0f11',
        cardBg: '#18181c',
        cardBorder: '#282830',
      }
    }
  }
}
</script>
<style>
body {
  background-color: #0f0f11;
  color: #f1f1f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #121215; }
::-webkit-scrollbar-thumb { background: #2a2a32; border-radius: 3px; }
</style>
</head>
<body class="min-h-screen pb-64 select-none">

<!-- OFFLINE STATUS BANNER -->
<div id="offlineBanner" class="bg-emerald-600/90 text-gray-950 font-bold text-xs py-1 px-3 text-center hidden flex items-center justify-center gap-1.5 shadow-md">
  <span>✅ Připraveno offline</span>
</div>

<!-- MAIN CONTAINER -->
<div class="max-w-md mx-auto px-3 pt-3">

  <!-- SEARCH & SCANNER BAR -->
  <div class="relative mb-2 flex gap-2">
    <div class="relative flex-grow">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
      <input type="text" id="searchInput" oninput="filterProducts()" 
             placeholder="Hledat pivo nebo limonádu..." 
             class="w-full pl-10 pr-4 py-3 bg-[#18181c] border border-[#282830] rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-brand transition text-base">
    </div>
    <!-- SCANNER BUTTON -->
    <button type="button" onclick="openScanner('scan')" class="bg-brand hover:bg-brandDark text-gray-950 font-bold px-3 py-3 rounded-xl flex items-center justify-center gap-1.5 transition shrink-0" title="Naskenovat kód">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m0 14v1m8-8h-1M5 12H4m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </svg>
      <span class="text-xs font-bold">Skenovat</span>
    </button>
    <!-- MAP EAN BUTTON -->
    <button type="button" onclick="openScanner('learn')" class="bg-[#282830] hover:bg-[#32323d] text-brand border border-brand/30 font-bold px-3 py-3 rounded-xl flex items-center justify-center gap-1.5 transition shrink-0" title="Naučit nový EAN kód">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <span class="text-xs font-bold">Učit EAN</span>
    </button>
  </div>

  <!-- ACTION BUTTONS: ARCHIVE, SAVED EANS & SETTINGS -->
  <div class="mb-3 px-1 flex justify-between items-center text-xs">
    <div class="flex gap-2 items-center">
      <button type="button" onclick="toggleCurrency()" class="bg-[#18181c] border border-[#282830] hover:border-brand text-gray-200 font-bold px-2.5 py-1 rounded-lg flex items-center gap-1 transition text-xs">
        <span id="currencyBadge">CZK (Kč)</span>
        <span class="text-brand">⇄</span>
      </button>
    </div>
    <div class="flex items-center gap-3">
      <button type="button" onclick="showArchiveModal()" class="text-brand hover:underline font-semibold text-xs flex items-center gap-1 cursor-pointer">📦 Archiv <span id="archiveBadgeCount" class="bg-brand/20 text-brand px-1.5 py-0.5 rounded-full text-[10px]">0</span></button>
      <button type="button" onclick="showSavedEansModal()" class="text-brand hover:underline font-semibold text-xs flex items-center gap-1 cursor-pointer">Správa EAN</button>
      <button type="button" onclick="openRateSettingsModal()" class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-[#282830] transition" title="Nastavení kurzu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- PRODUCTS LIST CONTAINER -->
  <div id="productList" class="space-y-2 mb-4">
    <!-- Dynamically rendered via JS -->
  </div>

  <!-- RETURNED / TAKEN KEGS & CRATES SECTION -->
  <div class="bg-[#18181c] border border-[#282830] rounded-2xl p-3 mb-6 shadow-md">
    <h3 class="font-bold text-sm text-white mb-2 flex items-center justify-between">
      <span>🔄 Zálohy na obaly a sudy (Vratky / Nákup)</span>
    </h3>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
      <div class="bg-[#121215] p-2.5 rounded-xl border border-[#24242c] flex justify-between items-center">
        <div>
          <div class="font-semibold text-gray-200">Vracení Sud Pivo</div>
          <div class="text-[10px] text-emerald-400 font-bold" id="labelBeerKegDep">-1 200 Kč / ks</div>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="changeReturnedKegs('beer', -1)" class="w-7 h-7 bg-[#24242c] active:bg-[#32323d] text-white rounded-lg font-bold text-sm flex items-center justify-center">-</button>
          <span id="returnedBeerKegsQty" class="w-5 text-center font-bold text-white text-base">0</span>
          <button type="button" onclick="changeReturnedKegs('beer', 1)" class="w-7 h-7 bg-brand active:bg-brandDark text-gray-950 rounded-lg font-bold text-sm flex items-center justify-center">+</button>
        </div>
      </div>
      <div class="bg-[#121215] p-2.5 rounded-xl border border-[#24242c] flex justify-between items-center">
        <div>
          <div class="font-semibold text-gray-200">Vracení Sud Limo</div>
          <div class="text-[10px] text-emerald-400 font-bold" id="labelLimoKegDep">-1 000 Kč / ks</div>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="changeReturnedKegs('limo', -1)" class="w-7 h-7 bg-[#24242c] active:bg-[#32323d] text-white rounded-lg font-bold text-sm flex items-center justify-center">-</button>
          <span id="returnedLimoKegsQty" class="w-5 text-center font-bold text-white text-base">0</span>
          <button type="button" onclick="changeReturnedKegs('limo', 1)" class="w-7 h-7 bg-brand active:bg-brandDark text-gray-950 rounded-lg font-bold text-sm flex items-center justify-center">+</button>
        </div>
      </div>
      <div class="bg-[#121215] p-2.5 rounded-xl border border-[#24242c] flex justify-between items-center">
        <div>
          <div class="font-semibold text-gray-200">Přepravka na pivo</div>
          <div class="text-[10px] text-brand font-bold" id="crateStatusLabel">±150 Kč / ks</div>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="changeCrates(-1)" class="w-7 h-7 bg-[#24242c] active:bg-[#32323d] text-white rounded-lg font-bold text-sm flex items-center justify-center">-</button>
          <span id="cratesQty" class="w-6 text-center font-bold text-white text-base">0</span>
          <button type="button" onclick="changeCrates(1)" class="w-7 h-7 bg-brand active:bg-brandDark text-gray-950 rounded-lg font-bold text-sm flex items-center justify-center">+</button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- FIXED BOTTOM BAR WITH SUMMARY & ORDER BUTTON -->
<div class="fixed bottom-0 left-0 right-0 bg-[#141417]/95 backdrop-blur-md border-t border-[#282830] p-3 shadow-2xl z-20">
  <div class="max-w-md mx-auto">
    <div class="grid grid-cols-2 gap-2 mb-2">
      <div class="bg-[#18181c] border border-[#282830] rounded-lg p-2 text-center">
        <div class="text-[11px] uppercase tracking-wider text-gray-400">CENA ZA NÁPOJE</div>
        <div class="text-lg font-bold text-brand" id="sumBeverages">0 Kč</div>
      </div>
      <div class="bg-[#18181c] border border-[#282830] rounded-lg p-2 text-center">
        <div class="text-[11px] uppercase tracking-wider text-gray-400">ZÁLOHA / VRATKA</div>
        <div class="text-lg font-bold text-brand" id="sumDeposits">0 Kč</div>
      </div>
    </div>
    <button type="button" onclick="openModal()" class="w-full bg-brand hover:bg-brandDark text-gray-950 font-bold py-3.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-base">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012 2h2a2 2 0 012-2M9 5a2 2 0 012-2h2a2 2 0
